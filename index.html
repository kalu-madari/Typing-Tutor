<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrutiDev Typing App</title>
    <script>
      (function() {
        try {
          var state = JSON.parse(localStorage.getItem('krutidev-settings-storage'));
          var theme = (state && state.state && state.state.theme) || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') document.documentElement.style.backgroundColor = '#0f172a';
          else document.documentElement.style.backgroundColor = '#ffffff';
        } catch(e) {
          document.documentElement.style.backgroundColor = '#0f172a';
        }
      })();
    </script>
    <style>
      body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
      #root { height: 100%; width: 100%; }
      #initial-loader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background-color: var(--bg-primary, #0f172a);
        color: var(--text-primary, #f8fafc);
        z-index: 999999;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .spinner {
        width: 40px; height: 40px;
        border: 4px solid rgba(99, 102, 241, 0.2);
        border-top: 4px solid #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div style="font-weight: 600; font-size: 1.1rem; letter-spacing: 1px;">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
